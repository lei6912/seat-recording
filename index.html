<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安慶國小一年甲班錄音作業</title>
<meta name="description" content="選座號、按一下錄音，就完成繳交。">
<link rel="stylesheet" href="assets/ui.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="pageTitle">安慶國小一年甲班錄音作業</h1>
      <p class="sub">選座號 → 錄音 → 送出，不用登入</p>
    </div>
  </header>

  <div id="backendWarn" class="msg msg--warn" hidden></div>

  <!-- 作業說明 -->
  <div id="noteCard" class="card" hidden>
    <h2>作業說明</h2>
    <p id="assignmentNote" class="help" style="margin-bottom:0"></p>
    <p id="deadlineNote" class="small muted" style="margin:8px 0 0" hidden></p>
  </div>

  <!-- 步驟 1：座號 -->
  <section class="card">
    <h2><span class="step">1</span>選擇你的座號</h2>
    <div id="seatGrid" class="seat-grid" role="group" aria-label="座號"></div>

    <label class="field" id="nameField" hidden style="margin-top:16px">
      <span>姓名</span>
      <input type="text" id="nameInput" autocomplete="name" placeholder="請填姓名">
    </label>

    <div id="seatNotice" class="msg msg--info" hidden></div>
  </section>

  <!-- 步驟 2：錄音 -->
  <section class="card">
    <h2><span class="step">2</span>錄音</h2>

    <!-- 瀏覽器不支援時顯示 -->
    <div id="supportWarn" class="msg msg--err" hidden></div>

    <div id="recorderUI">
      <p class="help" id="recHint">按一下麥克風開始錄音，講完再按一下停止。</p>

      <div class="rec-wrap">
        <button type="button" class="rec-btn" id="recBtn" aria-label="開始錄音">
          <svg class="rec-icon rec-icon--mic" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4z"/>
            <path d="M19 11a7 7 0 0 1-14 0M12 18v3M8 21h8" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg class="rec-icon rec-icon--stop" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <rect x="7" y="7" width="10" height="10" rx="2"/>
          </svg>
        </button>

        <div class="rec-info">
          <div class="rec-timer" id="recTimer">0:00</div>
          <div class="rec-limit small muted" id="recLimit"></div>
        </div>
      </div>
    </div>

    <!-- 錄完後的試聽與送出 -->
    <div id="reviewBox" hidden>
      <p class="help" style="margin:18px 0 8px">先聽一遍，可以的話再送出：</p>
      <audio id="reviewAudio" controls class="player-audio"></audio>

      <div class="btn-row" style="margin-top:14px">
        <button type="button" class="btn" id="sendBtn">送出繳交</button>
        <button type="button" class="btn btn--ghost" id="redoBtn">重新錄音</button>
      </div>
    </div>

    <div id="formMsg" class="msg" hidden></div>

    <!-- 送出成功 -->
    <div id="doneBox" hidden style="margin-top:18px">
      <p class="small muted" style="margin:0 0 8px">已繳交的錄音：</p>
      <audio id="doneAudio" controls class="player-audio"></audio>
    </div>
  </section>

  <footer class="foot">
    <p style="margin:0">
      交錯了想重交？選同一個座號再錄一次送出，系統會用新的錄音覆蓋舊的。<br>
      第一次按錄音時，瀏覽器會問要不要使用麥克風，請選「允許」。
    </p>
  </footer>

</div>

<script src="assets/config.js"></script>
<script src="assets/store.js"></script>
<script src="assets/recorder.js"></script>
<script src="assets/student.js"></script>
</body>
</html>
